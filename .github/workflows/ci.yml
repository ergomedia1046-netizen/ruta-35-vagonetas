name: CI
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: ruta35
          POSTGRES_PASSWORD: ci-password
          POSTGRES_DB: ruta35
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ruta35 -d ruta35"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://ruta35:ci-password@localhost:5432/ruta35
      SESSION_SECRET: ci-only-secret-with-at-least-32-characters
      NODE_ENV: test
      RUTA35_TEST_MODE: "true"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci
      - run: npm run db:generate
      - run: npm run db:migrate
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: Run reproducible full-day simulation
        run: |
          npm run simulate:day
          cp docs/SIMULACION_DIA_COMPLETO.md /tmp/SIMULACION_DIA_COMPLETO.first.md
          npm run simulate:day
          diff -u /tmp/SIMULACION_DIA_COMPLETO.first.md docs/SIMULACION_DIA_COMPLETO.md
      - name: Upload simulation report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: simulacion-dia-completo
          path: docs/SIMULACION_DIA_COMPLETO.md
          if-no-files-found: warn
      - run: npm audit

