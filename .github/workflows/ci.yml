name: CI
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: ruta35
          POSTGRES_PASSWORD: ci-password
          POSTGRES_DB: ruta35
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ruta35 -d ruta35"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://ruta35:ci-password@localhost:5432/ruta35
      SESSION_SECRET: ci-only-secret-with-at-least-32-characters
      NODE_ENV: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci
      - run: npx --yes --package yarn@1.22.22 yarn --cwd apps/passenger install --non-interactive
      - run: npx --yes --package yarn@1.22.22 yarn --cwd apps/driver install --non-interactive
      - run: npm run db:generate
      - run: npm run db:migrate
      - run: npm run typecheck
      - run: npm test
      - run: yarn typecheck
        working-directory: apps/passenger
      - run: yarn typecheck
        working-directory: apps/driver
      - run: npx --yes expo-doctor
        working-directory: apps/passenger
      - run: npx --yes expo-doctor
        working-directory: apps/driver
      - run: npx expo export --platform android --output-dir dist
        working-directory: apps/passenger
        env:
          EXPO_PUBLIC_API_BASE_URL: https://example.test
      - run: npx expo export --platform android --output-dir dist
        working-directory: apps/driver
        env:
          EXPO_PUBLIC_API_BASE_URL: https://example.test
      - run: npm run build
      - run: npm audit
